name: Iteration 10-13 CI

on:
  push:
    branches:
      - v5.5-dev-iteration10
      - v5.5-dev-iteration11
      - v5.5-dev-iteration12
      - v5.5-dev-iteration13
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: npm run check
      - name: Full regression suite
        run: npm test
