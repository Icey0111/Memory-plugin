name: Bootstrap Aetheria Unified Memory v5.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore plugin payload
        shell: bash
        run: |
          cat > /tmp/aetheria-plugin.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/aetheria-plugin.b64 > /tmp/aetheria-plugin.zip
          unzip -oq /tmp/aetheria-plugin.zip -d .
          rm -f /tmp/aetheria-plugin.b64 /tmp/aetheria-plugin.zip
      - name: Commit plugin files
        shell: bash
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish Aetheria Unified Memory v5.4.0"
            git push
          fi
