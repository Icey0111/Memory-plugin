name: Publish Aetheria Unified Memory v5.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore verified plugin payload
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/fix00.0 .bootstrap/fix00.1 .bootstrap/fix00.2.correct .bootstrap/fix00.3
            cat .bootstrap/payload.part01 .bootstrap/payload.part02
            cat .bootstrap/release.part03
            cat .bootstrap/payload.part04 .bootstrap/payload.part05 .bootstrap/payload.part06
            cat .bootstrap/fix07.0 .bootstrap/fix07.1 .bootstrap/fix07.2 .bootstrap/fix07.3
          } | tr -d '\r\n' | base64 --decode > /tmp/aetheria-plugin.zip
          echo "6336a2235aa79b522ea0ed94c74f0c327ebede9a593ea23a619a6d6de353aec5  /tmp/aetheria-plugin.zip" | sha256sum -c -
          unzip -oq /tmp/aetheria-plugin.zip -d .
          rm -f /tmp/aetheria-plugin.zip

      - name: Validate source package
        shell: bash
        run: |
          set -euo pipefail
          node --check memory-core.js
          node --check memory-extractor.js
          node --check baseline-index.js
          node --check baseline-host.js
          node --check index.js
          npm test

      - name: Remove bootstrap transport and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish Aetheria Unified Memory v5.4.0"
            git push
          fi
