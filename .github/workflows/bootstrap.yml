name: Bootstrap Aetheria Unified Memory v5.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore plugin payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* | tr -d '\r\n' | base64 --decode > /tmp/aetheria-plugin.zip
          unzip -oq /tmp/aetheria-plugin.zip -d .
          rm -f /tmp/aetheria-plugin.zip

      - name: Commit plugin files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish Aetheria Unified Memory v5.4.0"
            git push
          fi
