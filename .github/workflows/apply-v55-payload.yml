name: Apply v5.5 staged payload

on:
  push:
    branches:
      - v5.5-dev-iteration03-action

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[payload-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate staged package
        shell: bash
        run: |
          set -euo pipefail
          cat .v55-payload/part* > /tmp/aum-v55.b64
          base64 -d /tmp/aum-v55.b64 > /tmp/aum-v55.zip
          rm -rf /tmp/aum-v55-extracted
          mkdir -p /tmp/aum-v55-extracted
          unzip -q /tmp/aum-v55.zip -d /tmp/aum-v55-extracted
          src="/tmp/aum-v55-extracted/aetheria-unified-memory-v5_4"
          test -f "$src/index.js"
          test -f "$src/setting-index.js"
          test -f "$src/setting-store.js"
          test -f "$src/setting-importer.js"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. .

          npm run check
          npm test

      - name: Publish reconstructed tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish v5.5 development iteration 03 [payload-applied]"
          git push origin HEAD:v5.5-dev-iteration03-action
