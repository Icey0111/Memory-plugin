name: Publish v5.5 iteration 06

on:
  push:
    branches:
      - v5.5-dev-iteration06

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[iter06-published]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish staged package
        shell: bash
        run: |
          set -e
          base64 -d .v55-iter06/full.b64 > /tmp/aum-v55.tar.xz
          rm -rf /tmp/aum-v55
          mkdir -p /tmp/aum-v55
          tar -xJf /tmp/aum-v55.tar.xz -C /tmp/aum-v55
          src="/tmp/aum-v55/aetheria-unified-memory-v5_4"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish v5.5 iteration 06 [iter06-published]"
          git push origin HEAD:v5.5-dev-iteration06
